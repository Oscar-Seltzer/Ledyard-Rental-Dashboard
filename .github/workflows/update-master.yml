name: Update master.csv

on:
  push:
    branches:
      - main
    paths:
      - 'public/data/**'
      - 'build-master.mjs'

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node build-master.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/master.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update public/master.csv from latest data upload"
            git push
          fi